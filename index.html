ter/cover fixed;font-family:'Cinzel',Georgia,serif;color:#f6dfb0;padding:18px 10px 50px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55));pointer-events:none}
header{position:relative;text-align:center;margin-bottom:22px}
h1{margin:0 0 14px;font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:.06em;color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px rgba(255,170,60,.45)}
.bar{display:inline-flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;background:rgba(25,10,3,.72);border:2px solid #b97a22;border-radius:12px;padding:10px 18px;font-size:.9rem}
.bar label{display:flex;align-items:center;gap:8px}
input[type=range]{accent-color:var(--gold)}
.bar button,dialog button{font:inherit;color:var(--ink);background:linear-gradient(#f3c366,#c8892c);border:1px solid #7a4a10;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:700}
.bar button:hover,dialog button:hover{filter:brightness(1.12)}
main{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px;max-width:1100px;margin:0 auto}
@media (min-width:700px){main{grid-template-columns:repeat(3,1fr);gap:10px 14px}}

<body>
<header>
  <h1>⚔ La Taverne des Ambiances ⚔</h1>
  <div class="bar">
    <label>Volume général <input type="range" id="master" min="0" max="100" value="70"></label>
    <label><input type="checkbox" id="solo"> Une ambiance à la fois</label>
    <button id="stopAll">■ Tout arrêter</button>
    <span class="mj bar" style="border:0;padding:0;background:none;gap:10px">
      <button id="addBtn">＋ Ajouter un bouton</button>
      <button id="expBtn">💾 Exporter</button>
      <button id="impBtn">📂 Importer</button>
      <input type="file" id="impIn" accept=".zip" hidden="">
    </span>
  </div>
</header>
<main id="grid"></main>
<footer>
  <span class="mj">Mode Maître du Jeu · « Exporter » crée un .zip : sauvegarde et site prêt pour Netlify.</span>
  <span class="pl">Clique sur un parchemin pour lancer l’ambiance en boucle.</span>
</footer>

<dialog id="dlg">
  <h2>Régler l’ambiance</h2>
  <label for="nameIn">Nom du bouton</label>
  <input type="text" id="nameIn" maxlength="40">
  <label for="fileIn">Musique d’ambiance (mp3, ogg, wav…)</label>
  <input type="file" id="fileIn" accept="audio/*">
  <div id="fileInfo"></div>
  <label for="volIn">Volume de cette ambiance</label>
  <input type="range" id="volIn" min="0" max="100" value="100" style="width:100%">
  <div class="row">
    <button class="danger" id="delBtn">Supprimer le bouton</button>
    <button class="danger" id="rmBtn">Retirer le son</button>
    <button id="okBtn">Valider</button>
  </div>
</dialog>

<script>
const SELF = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const $ = s => document.querySelector(s);
const audios = {}, blobs = {}, els = {};
let slots = [], cur = null, player = false, nextId = 0, pending = null, removed = false;
const MIME = {mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav',m4a:'audio/mp4',flac:'audio/flac',webm:'audio/webm',aac:'audio/aac',opus:'audio/ogg'};
const ext = n => (String(n).split('.').pop() || 'mp3').toLowerCase();
const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase() || 'son';
const byId = id => slots.find(s => s.id === id);
const save = () => { try { localStorage.setItem('taverne-slots', JSON.stringify({slots, nextId})); } catch(e) {} };

/* Stockage local des sons (IndexedDB) */
const dbp = new Promise((res, rej) => {
  try { const r = indexedDB.open('taverne-sons', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  } catch(e) { rej(e); }
});
const idb = (mode, fn) => dbp.then(db => new Promise((res, rej) => {
  const t = db.transaction('f', mode), rq = fn(t.objectStore('f'));
  t.oncomplete = () => res(rq.result); t.onerror = () => rej(t.error);
})).catch(() => null);

/* Audio */
const master = () => $('#master').value / 100;
function applyVol(id){ if (audios[id]) audios[id].volume = Math.min(1, master() * byId(id).vol / 100); }
function setAudio(id, blob){
  if (audios[id]) { audios[id].pause(); URL.revokeObjectURL(audios[id].src); }
  const a = new Audio(URL.createObjectURL(blob));
  a.loop = true; a.onplay = a.onpause = () => render(id);
  audios[id] = a; applyVol(id);
}
function clearAudio(id){
  if (audios[id]) { audios[id].pause(); if (!player) URL.revokeObjectURL(audios[id].src); delete audios[id]; }
  delete blobs[id];
}
function render(id){
  const b = els[id], s = byId(id); if (!b || !s) return;
  b.textContent = s.name;
  b.classList.toggle('empty', !audios[id]);
  b.classList.toggle('on', !!audios[id] && !audios[id].paused);
}
function toggle(id){
  const a = audios[id];
  if (!a) { if (!player) openDlg(id); return; }
  if (!a.paused) { a.pause(); return; }
  if ($('#solo').checked) Object.keys(audios).forEach(k => { if (+k !== id) audios[k].pause(); });
  a.play().catch(() => {});
}

/* Grille */
function build(){
  const grid = $('#grid'); grid.innerHTML = '';
  slots.forEach(s => {
    const d = document.createElement('div'); d.className = 'slot';
    const p = document.createElement('button'); p.className = 'pad empty'; p.onclick = () => toggle(s.id);
    els[s.id] = p; d.appendChild(p);
    if (!player) {
      const c = document.createElement('button'); c.className = 'cog'; c.textContent = '⚙'; c.title = 'Régler';
      c.onclick = () => openDlg(s.id); d.appendChild(c);
    }
    grid.appendChild(d); render(s.id);
  });
  if (!player) slots.forEach(async s => {
    if (audios[s.id] || !s.file) return;
    const b = await idb('readonly', st => st.get(s.id));
    if (b) { blobs[s.id] = b; setAudio(s.id, b); render(s.id); }
  });
}

/* Boîte de réglage (mode MJ) */
const dlg = $('#dlg');
function openDlg(id){
  cur = id; pending = null; removed = false; const s = byId(id);
  $('#nameIn').value = s.name; $('#volIn').value = s.vol; $('#fileIn').value = '';
  $('#fileInfo').textContent = audios[id] ? 'Son actuel : ' + (s.file || 'chargé') : 'Aucun son associé';
  dlg.showModal();
}
$('#fileIn').onchange = e => { pending = e.target.files[0] || null; removed = false; if (pending) $('#fileInfo').textContent = 'Nouveau : ' + pending.name; };
$('#rmBtn').onclick = () => { pending = null; removed = true; $('#fileInfo').textContent = 'Le son sera retiré'; };
$('#okBtn').onclick = async () => {
  const id = cur, s = byId(id);
  s.name = $('#nameIn').value.trim() || 'Ambiance';
  s.vol = +$('#volIn').value;
  if (pending) { s.file = pending.name; blobs[id] = pending; setAudio(id, pending); await idb('readwrite', st => st.put(pending, id)); }
  else if (removed) { s.file = ''; clearAudio(id); await idb('readwrite', st => st.delete(id)); }
  applyVol(id); save(); render(id); dlg.close();
};
$('#delBtn').onclick = async () => {
  if (!confirm('Supprimer ce bouton ?')) return;
  const id = cur; clearAudio(id); await idb('readwrite', st => st.delete(id));
  slots = slots.filter(s => s.id !== id); save(); build(); dlg.close();
};
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
$('#addBtn').onclick = () => {
  slots.push({id: nextId++, name: 'Ambiance ' + (slots.length + 1), file: '', vol: 100});
  save(); build(); openDlg(slots[slots.length - 1].id);
};
$('#master').oninput = () => Object.keys(audios).forEach(k => applyVol(+k));
$('#stopAll').onclick = () => Object.values(audios).forEach(a => a.pause());

/* ZIP minimal (écriture sans compression, lecture avec ou sans) */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = -1; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; };
function makeZip(files){
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;
  for (const f of files) {
    const nb = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const l = new DataView(new ArrayBuffer(30));
    l.setUint32(0, 0x04034b50, true); l.setUint16(4, 20, true); l.setUint16(6, 0x0800, true); l.setUint16(12, 0x21, true);
    l.setUint32(14, crc, true); l.setUint32(18, sz, true); l.setUint32(22, sz, true); l.setUint16(26, nb.length, true);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
    parts.push(l.buffer, nb, f.data); cd.push(c.buffer, nb); off += 30 + nb.length + sz;
  }
  const cdSize = cd.reduce((a, x) => a + (x.byteLength ?? x.length), 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cd, e.buffer], {type: 'application/zip'});
}
async function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder(), out = {};
  let eo = u8.length - 22; while (eo >= 0 && dv.getUint32(eo, true) !== 0x06054b50) eo--;
  if (eo < 0) throw 0;
  let p = dv.getUint32(eo + 16, true);
  for (let i = 0, n = dv.getUint16(eo + 10, true); i < n; i++) {
    const m = dv.getUint16(p + 10, true), cs = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    const st = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    let d = u8.subarray(st, st + cs);
    if (m === 8) d = new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    out[name] = d; p += 46 + nl + el + cl;
  }
  return out;
}

/* Export / import */
$('#expBtn').onclick = async () => {
  const files = [], list = [], enc = new TextEncoder();
  for (const [i, s] of slots.entries()) {
    let f = '';
    if (audios[s.id] && blobs[s.id]) {
      f = 'sons/' + String(i + 1).padStart(2, '0') + '-' + slug(s.name) + '.' + ext(s.file);
      files.push({name: f, data: new Uint8Array(await blobs[s.id].arrayBuffer())});
    }
    list.push({name: s.name, file: f, vol: s.vol, orig: s.file});
  }
  files.unshift({name: 'soundbox.json', data: enc.encode(JSON.stringify({version: 1, slots: list}, null, 1))});
  files.unshift({name: 'index.html', data: enc.encode(SELF)});
  const a = document.createElement('a'); a.href = URL.createObjectURL(makeZip(files)); a.download = 'soundbox-taverne.zip'; a.click();
};
$('#impBtn').onclick = () => $('#impIn').click();
$('#impIn').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const z = await readZip(await file.arrayBuffer());
    const k = Object.keys(z).find(n => n.endsWith('soundbox.json')); if (!k) throw 0;
    const pre = k.slice(0, -13), j = JSON.parse(new TextDecoder().decode(z[k]));
    if (!confirm('Remplacer la soundbox actuelle par cette sauvegarde ?')) return;
    for (const s of slots) { clearAudio(s.id); await idb('readwrite', st => st.delete(s.id)); }
    slots = []; nextId = 0;
    for (const o of j.slots) {
      const s = {id: nextId++, name: o.name, file: '', vol: o.vol ?? 100}; slots.push(s);
      const d = o.file && z[pre + o.file];
      if (d) { const b = new Blob([d], {type: MIME[ext(o.file)] || 'audio/mpeg'}); s.file = o.orig || o.file; blobs[s.id] = b; setAudio(s.id, b); await idb('readwrite', st => st.put(b, s.id)); }
    }
    save(); build();
  } catch(err) { alert('Sauvegarde illisible : choisis le .zip exporté depuis cette soundbox.'); }
};

/* Démarrage : mode joueur si un soundbox.json est hébergé à côté de la page */
(async () => {
  if (!/[?&]mj\b/.test(location.search) && /^https?:/.test(location.protocol)) {
    try {
      const r = await fetch('soundbox.json', {cache: 'no-store'});
      if (r.ok) {
        const j = await r.json(); player = true;
        slots = j.slots.filter(s => s.file).map((s, i) => ({id: i, name: s.name, vol: s.vol ?? 100, file: s.file}));
        slots.forEach(s => { const a = new Audio(encodeURI(s.file)); a.loop = true; a.preload = 'none'; a.onplay = a.onpause = () => render(s.id); audios[s.id] = a; applyVol(s.id); });
      }
    } catch(e) {}
  }
  if (!player) {
    let st = null; try { st = JSON.parse(localStorage.getItem('taverne-slots')); } catch(e) {}
    if (Array.isArray(st)) slots = st.map((s, i) => ({...s, id: i}));
    else if (st) { slots = st.slots || []; nextId = st.nextId || 0; }
    if (!slots.length) slots = Array.from({length: 12}, (_, i) => ({id: i, name: 'Ambiance ' + (i + 1), file: '', vol: 100}));
    nextId = Math.max(nextId, ...slots.map(s => s.id + 1));
  }
  document.body.classList.add(player ? 'player' : 'mj-mode', 'ready');
  build();
})();
